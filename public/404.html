<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Abba Homes Properties</title>
    <script>
      // Capture the path the user was trying to access
      const path = window.location.pathname;
      const search = window.location.search;

      // Save the full path to sessionStorage before redirecting
      sessionStorage.setItem('spa-redirect', path + search);

      // Redirect to the root of your site
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
